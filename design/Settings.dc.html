<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Nabız zone ayarları</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0E12}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; padding: 18px 20px; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

<div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 10px"><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700">Zone ayarları</div><div style="font-size: 16px; color: #9AA4B0">İzzet</div></div>
<button style="height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: #4CC07F; color: #0B0E12; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: 600">Kaydet</button>
</div>

<div style="display: flex; gap: 12px; height: 382px">
<div style="width: 300px; display: flex; flex-direction: column; gap: 12px">

<div style="background: #12161C; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">KAYNAK</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button onClick="{{useAge}}" style="height: 48px; border-radius: 10px; border: 2px solid {{ageBorder}}; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 0">Yaşa göre</button>
<button onClick="{{useGarmin}}" style="height: 48px; border-radius: 10px; border: 2px solid {{garminBorder}}; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 0">Garmin</button>
<button onClick="{{useManual}}" style="height: 48px; border-radius: 10px; border: 2px solid {{manualBorder}}; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 0">Elle</button>
</div>
<sc-if value="{{isAge}}" hint-placeholder-val="{{ true }}">
<div style="height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
<div style="font-size: 14px; font-weight: 600">Profildeki yaş: 45</div>
<div style="font-size: 13px; color: #9AA4B0">Maks. = 208 − 0,7 × yaş (Tanaka)</div>
</div>
</sc-if>
<sc-if value="{{isGarmin}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 8px">
<div style="width: 9px; height: 9px; border-radius: 5px; background: #4CC07F"></div>
<div style="font-size: 14px; font-weight: 600">Eşitlendi</div>
</div>
<div style="font-size: 13px; color: #9AA4B0">[Tarih, saat] · profil: Genel</div>
</div>
<button style="height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2A313B; background: #161B22; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600">Eşitle</button>
</div>
</sc-if>
<sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
<div style="height: 44px; display: flex; align-items: center; font-size: 14px; line-height: 1.4; color: #9AA4B0">Değerleri aşağıdan elle gir.</div>
</sc-if>
</div>

<div style="flex-grow: 1; background: #12161C; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px">
<div style="height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="font-size: 14px; font-weight: 600; color: #9AA4B0; width: 86px">Maks. nabız</div>
<sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
<button aria-label="Maks. nabzı azalt" onClick="{{maxDown}}" style="width: 48px; height: 48px; border-radius: 10px; border: 1px solid #2A313B; background: #161B22; color: #E8ECF1; font-size: 24px; font-weight: 600">−</button>
</sc-if>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 42px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{max}}</div>
<sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
<button aria-label="Maks. nabzı artır" onClick="{{maxUp}}" style="width: 48px; height: 48px; border-radius: 10px; border: 1px solid #2A313B; background: #161B22; color: #E8ECF1; font-size: 24px; font-weight: 600">+</button>
</sc-if>
<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 12px; font-weight: 600; color: #5AA0E0; border: 1px solid #2A4A68; border-radius: 6px; padding: 4px 8px">{{tag}}</div>
</sc-if>
</div>
<div style="height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="font-size: 14px; font-weight: 600; color: #9AA4B0; width: 86px">Dinlenik nabız</div>
<sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
<button aria-label="Dinlenik nabzı azalt" onClick="{{restDown}}" style="width: 48px; height: 48px; border-radius: 10px; border: 1px solid #2A313B; background: #161B22; color: #E8ECF1; font-size: 24px; font-weight: 600">−</button>
</sc-if>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 42px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{rest}}</div>
<sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
<button aria-label="Dinlenik nabzı artır" onClick="{{restUp}}" style="width: 48px; height: 48px; border-radius: 10px; border: 1px solid #2A313B; background: #161B22; color: #E8ECF1; font-size: 24px; font-weight: 600">+</button>
</sc-if>
<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 12px; font-weight: 600; color: #5AA0E0; border: 1px solid #2A4A68; border-radius: 6px; padding: 4px 8px">{{tag}}</div>
</sc-if>
</div>
</div>
</div>

<div style="flex-grow: 1; background: #12161C; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 44px; display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">ZONE'LAR</div>
<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 13px; color: #9AA4B0">{{zoneNote}}</div>
</sc-if>
<sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 6px">
<button onClick="{{useMax}}" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 2px solid {{maxBorder}}; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600">% Maks.</button>
<button onClick="{{useHrr}}" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 2px solid {{hrrBorder}}; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600">Nabız rezervi</button>
</div>
</sc-if>
</div>
<sc-for list="{{zones}}" as="z" hint-placeholder-count="5">
<div style="height: 52px; border-radius: 10px; background: #0B0E12; display: flex; align-items: center; gap: 14px; padding: 0 14px">
<div style="width: 6px; height: 32px; border-radius: 3px; background: {{z.color}}"></div>
<div style="width: 44px; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: {{z.color}}">Z{{z.n}}</div>
<div style="flex-grow: 1; font-size: 16px; font-weight: 500">{{z.name}}</div>
<div style="font-size: 14px; color: #9AA4B0">{{z.pct}}</div>
<div style="width: 104px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums">{{z.range}}</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { source: 'age', max: 177, rest: 60, method: 'max' };
  }
  renderVals() {
    const { source, max, rest } = this.state;
    const isAge = source === 'age', isGarmin = source === 'garmin', isManual = source === 'manual';
    const method = isManual ? this.state.method : 'max';
    const colors = ['#A8B0BA', '#5AA0E0', '#4CC07F', '#F59A3C', '#F0605A'];
    const names = ['Isınma', 'Kolay', 'Aerobik', 'Eşik', 'Maksimum'];
    const bounds = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0];
    const at = (p) => method === 'max' ? Math.round(max * p) : Math.round(rest + (max - rest) * p);
    const zones = colors.map((c, i) => ({
      n: i + 1, color: c, name: names[i],
      pct: '%' + Math.round(bounds[i] * 100) + '–' + Math.round(bounds[i + 1] * 100),
      range: at(bounds[i]) + '–' + at(bounds[i + 1])
    }));
    const set = (patch) => () => this.setState(patch);
    const on = '#4CC07F', off = '#2A313B';
    return {
      max, rest, zones, isAge, isGarmin, isManual, locked: !isManual,
      tag: isAge ? 'PROFİL' : 'GARMIN',
      zoneNote: isAge ? 'Yaştan hesaplanan maks. nabza göre' : 'Garmin Connect\'ten, saatinle aynı',
      useAge: set({ source: 'age', max: 177, rest: 60 }),
      useGarmin: set({ source: 'garmin', max: 180, rest: 58 }),
      useManual: set({ source: 'manual' }),
      ageBorder: isAge ? on : off, garminBorder: isGarmin ? on : off, manualBorder: isManual ? on : off,
      maxUp: set({ max: Math.min(max + 1, 220) }),
      maxDown: set({ max: Math.max(max - 1, rest + 20) }),
      restUp: set({ rest: Math.min(rest + 1, max - 20) }),
      restDown: set({ rest: Math.max(rest - 1, 30) }),
      useMax: set({ method: 'max' }),
      useHrr: set({ method: 'hrr' }),
      maxBorder: method === 'max' ? on : off,
      hrrBorder: method === 'hrr' ? on : off
    };
  }
}
</script>
</body>
</html>

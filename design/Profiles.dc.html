<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Profil seçimi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0E12}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; padding: 18px 20px; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; line-height: 1">Kim antrenman yapıyor?</div>
<div style="font-size: 14px; color: #9AA4B0">Profile dokun, zone'lar o kişiye göre yüklenir</div>
</div>
<button style="height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #2A313B; background: #161B22; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600">Düzenle</button>
</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: center">
<button style="height: 290px; border-radius: 16px; border: 2px solid #4CC07F; background: #12161C; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0">
<div style="font-size: 12px; font-weight: 600; color: #4CC07F">Son kullanan</div>
<svg width="112" height="112" viewBox="0 0 112 112">
<circle cx="56.0" cy="56.0" r="53.0" fill="none" stroke="#4CC07F" stroke-width="4"></circle>
<circle cx="56.0" cy="56.0" r="47.0" fill="#2A313B"></circle>
<text x="56.0" y="71" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="40" font-weight="700" fill="#E8ECF1">İ</text>
</svg>
<div style="font-size: 20px; font-weight: 600">İzzet</div>
<div style="font-size: 13px; color: #9AA4B0">45 yaş · Garmin</div>
</button>
<button style="height: 290px; border-radius: 16px; border: 2px solid #12161C; background: #12161C; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0">
<div style="height: 17px"></div>
<svg width="112" height="112" viewBox="0 0 112 112">
<circle cx="56.0" cy="56.0" r="53.0" fill="none" stroke="#2A313B" stroke-width="4"></circle>
<circle cx="56.0" cy="56.0" r="47.0" fill="#2A313B"></circle>
<text x="56.0" y="71" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="40" font-weight="700" fill="#E8ECF1">K</text>
</svg>
<div style="font-size: 20px; font-weight: 600">[Kişi 2]</div>
<div style="font-size: 13px; color: #9AA4B0">Yaşa göre zone</div>
</button>
<button style="height: 290px; border-radius: 16px; border: 2px solid #12161C; background: #12161C; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0">
<div style="height: 17px"></div>
<svg width="112" height="112" viewBox="0 0 112 112">
<circle cx="56.0" cy="56.0" r="53.0" fill="none" stroke="#2A313B" stroke-width="4"></circle>
<circle cx="56.0" cy="56.0" r="47.0" fill="#2A313B"></circle>
<text x="56.0" y="71" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="40" font-weight="700" fill="#E8ECF1">?</text>
</svg>
<div style="font-size: 20px; font-weight: 600">Konuk</div>
<div style="font-size: 13px; color: #9AA4B0">Tek seferlik, kaydedilmez</div>
</button>
<button style="height: 290px; border-radius: 16px; border: 2px dashed #3A424D; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#9AA4B0" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
<div style="font-size: 18px; font-weight: 600">Yeni profil</div>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>

  }

</body>
</html>

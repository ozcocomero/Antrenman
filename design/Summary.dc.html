<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Seans özeti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0E12}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; padding: 18px 20px; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

<div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="48" height="48" viewBox="0 0 48 48">
<circle cx="24" cy="24" r="22" fill="none" stroke="#4CC07F" stroke-width="3"></circle>
<circle cx="24" cy="24" r="18" fill="#2A313B"></circle>
<text x="24" y="31" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="20" font-weight="700" fill="#E8ECF1">İ</text>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; line-height: 1">İzzet · Seans özeti</div>
<div style="font-size: 14px; color: #9AA4B0">[Tarih] · [Başlangıç saati] · Suunto Smart Sensor</div>
</div>
</div>
<div style="display: flex; gap: 10px">
<button style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #5A2A28; background: #161B22; color: #F0908A; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600">Kapat</button>
<button style="height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #2A313B; background: #161B22; color: #E8ECF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600">Yeni seans</button>
<button style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #4CC07F; color: #0B0E12; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600">Kaydet</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
<div style="background: #12161C; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">SÜRE</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">32:14</div>
</div>
<div style="background: #12161C; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">ORT. NABIZ</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">131</div>
</div>
<div style="background: #12161C; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">EN YÜKSEK</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; color: #F0605A">171</div>
</div>
<div style="background: #12161C; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">ORT. SICAKLIK</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">24,3°</div>
</div>
<div style="background: #12161C; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">ORT. NEM</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">%57</div>
</div>
</div>

<div style="flex-grow: 1; background: #12161C; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9AA4B0">ZONE'LARDA GEÇEN SÜRE</div>
<div style="height: 22px; border-radius: 6px; overflow: hidden; display: flex; gap: 2px">
<sc-for list="{{zones}}" as="z" hint-placeholder-count="5">
<div style="height: 22px; width: {{z.w}}; background: {{z.color}}"></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{zones}}" as="z" hint-placeholder-count="5">
<div style="height: 30px; display: flex; align-items: center; gap: 12px">
<div style="width: 40px; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; color: {{z.color}}">Z{{z.n}}</div>
<div style="width: 110px; font-size: 15px">{{z.name}}</div>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #232A33; overflow: hidden">
<div style="height: 8px; border-radius: 4px; width: {{z.rel}}; background: {{z.color}}"></div>
</div>
<div style="width: 70px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">{{z.t}}</div>
<div style="width: 44px; text-align: right; font-size: 14px; color: #9AA4B0">{{z.p}}</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#A8B0BA', '#5AA0E0', '#4CC07F', '#F59A3C', '#F0605A'];
    const names = ['Isınma', 'Kolay', 'Aerobik', 'Eşik', 'Maksimum'];
    const times = ['04:10', '09:32', '12:48', '05:04', '00:40'];
    const w = ['13%', '29%', '40%', '16%', '2%'];
    const p = ['%13', '%30', '%40', '%16', '%2'];
    const rel = ['33%', '74%', '100%', '40%', '5%'];
    return {
      zones: colors.map((c, i) => ({ n: i + 1, color: c, name: names[i], t: times[i], w: w[i], p: p[i], rel: rel[i] }))
    };
  }
}
</script>
</body>
</html>

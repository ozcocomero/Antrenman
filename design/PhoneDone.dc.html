<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Telefon: sonuç</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0E12}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 22px; background: #0B0E12; color: #E8ECF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px"><svg viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 2.8 4.5 6.4 4.1c2.1-.2 3.9 1 5.6 3 1.7-2 3.5-3.2 5.6-3 3.6.4 5.5 4.2 4 7.6C19.5 16.4 12 21 12 21z" fill="#4CC07F"></path></svg><div style="font-size: 14px; font-weight: 600; color: #9AA4B0">PT Ekran</div></div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
<sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
<svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#4CC07F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="7 12.5 10.5 16 17 9"></polyline></svg>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700">Gönderildi</div>
<div style="font-size: 16px; line-height: 1.5; color: #C3CAD3">Cihaz ekranında “Kullan”a dokunarak onayla. Bu sayfayı kapatabilirsin.</div>
</sc-if>
<sc-if value="{{bad}}" hint-placeholder-val="{{ false }}">
<svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#F59A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700">Bağlantı geçersiz</div>
<div style="font-size: 16px; line-height: 1.5; color: #C3CAD3">Süresi dolmuş, kullanılmış ya da iptal edilmiş. Cihazdan yeni QR kod al.</div>
</sc-if>
<sc-if value="{{fail}}" hint-placeholder-val="{{ false }}">
<svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#F0605A" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="7" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700">Gönderilemedi</div>
<div style="font-size: 16px; line-height: 1.5; color: #C3CAD3">Telefon cihazın ağından ayrılmış olabilir. Wi-Fi'yi kontrol et, sonra tekrar dene.</div>
<button style="height: 56px; width: 100%; border-radius: 14px; border: 0; background: #4CC07F; color: #0B0E12; font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; font-weight: 600">Tekrar dene</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["gönderildi","geçersiz bağlantı","gönderilemedi"],"default":"gönderildi"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'gönderildi';
    return { ok: st === 'gönderildi', bad: st === 'geçersiz bağlantı', fail: st === 'gönderilemedi' };
  }
}
</script>
</body>
</html>
